version: "3.9"
name: django_graphql_project

services:
  postgres:
    image: postgres:17.4-alpine3.21
    container_name: test_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"

  django:
    build: .
    container_name: test-django_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./app:/app
    depends_on:
      - postgres
    ports:
      - "${DJANGO_PORT}:8000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
    command: >
      sh -c "
          if python manage.py shell -c 'from django.contrib.auth.models import User; print(User.objects.filter(username=\"admin\").exists())' | grep -q 'True'; then
            echo 'Admin user exists, skipping app and database setup';
          else
            if [ ! -f manage.py ]; then 
              django-admin startproject core .; 
            fi &&
            if [ ! -d inventory ]; then 
              python manage.py startapp inventory; 
            fi &&
            rm -f inventory/migrations/0001_initial.py &&
            python manage.py migrate &&
            python manage.py makemigrations &&
            python manage.py migrate inventory &&
            python manage.py shell -c 'from django.contrib.auth.models import User; User.objects.create_superuser(\"admin\", \"admin@example.com\", \"admin\");' ;
          fi &&
          python manage.py runserver 0.0.0.0:8000
        "